; Settings for the Dice Fantasy wrapper (dinput.dll).
; Place next to DiceFantasy.exe. 1 = on, 0 = off.

[Game]
; Prefer DirectDraw's software renderer over the video driver. (-EMU)
Emulation=0
; Allow all four players to be computer-controlled on the setup screen. (-ALLCOM)
AllComputer=0

[Wrapper]
; Allow running on 24/32-bit desktops (the game only accepts 16-bit otherwise).
TrueColor=1
; Make near-magenta sprite backgrounds transparent at 24/32-bit.
ColorKeyFix=1
; Show the game's Japanese error messages correctly on non-Japanese systems,
; translated through dialog.txt next to the exe if it exists.
UnicodeMessageBox=1
; Correct the font's character table (h/i drew Y/Z, Y/Z drew "0", a few kanji typos)
; and add ’ ” for apostrophes/quotes in translations.
FontTableFix=1

[Text]
; How translated in-game text is drawn: system (a Windows font) or bitmap (the game's
; font, full-width characters only). Table entries can override this per string with a
; {system} or {bitmap} prefix. Untranslated text always uses the game's font.
Renderer=system
FontFace=Tahoma
; Pixel height of the font. The game spaces lines 18 px apart; 13 fits with the outline.
FontSize=13
FontBold=1
